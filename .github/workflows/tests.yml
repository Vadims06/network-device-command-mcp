name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The parity test installs the proxy's main branch, so a new proxy operation
  # without an MCP tool is caught here even when this repository did not change.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest tests -v
