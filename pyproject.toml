[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-device-command-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.4.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# The proxy is imported by tests/test_proxy_parity.py to learn which
# operations exist; it is never used at runtime.
test = [
    "pytest",
    "network-device-command-proxy @ git+https://github.com/Vadims06/network-device-command-proxy.git@main",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
